[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rentalanalysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "typer[all]>=0.12",
]

[project.scripts]
rentalysis = "rentalanalysis.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rentalanalysis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires browser (deselect with -m 'not integration')"]
